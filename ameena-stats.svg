<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 190" width="440" height="190" role="img" aria-label="Ameena's GitHub stats">
<defs>
<style><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes ringDraw{from{stroke-dashoffset:283}to{stroke-dashoffset:calc(283 - (283 * var(--pct)) / 100)}}
.row{opacity:0;animation:slideIn .5s ease forwards}
.ring{stroke-dashoffset:283;animation:ringDraw 1.4s cubic-bezier(.2,.7,.3,1) .3s forwards}
]]></style>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#3b82f6"/>
</linearGradient>
</defs>
<rect x="1" y="1" width="438" height="188" rx="14" fill="#0a1826" stroke="#123043" stroke-width="1"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#e6f6f8" style="animation:fadeIn .5s ease forwards">Ameena's GitHub Stats</text>

<g transform="translate(340,88)">
  <circle r="46" fill="none" stroke="#123043" stroke-width="9"/>
  <circle class="ring" r="46" fill="none" stroke="url(#g1)" stroke-width="9" stroke-linecap="round"
    stroke-dasharray="283" transform="rotate(-90)" style="--pct:72"/>
  <text text-anchor="middle" y="6" font-size="20" font-weight="800" fill="#67e8f9">B+</text>
</g>

<g font-size="13.5" fill="#c9d1d9">
  <g class="row" style="animation-delay:.5s"><circle cx="30" cy="66" r="4" fill="#22d3ee"/><text x="42" y="70">Public Repos</text><text x="290" y="70" text-anchor="end">2</text></g>
  <g class="row" style="animation-delay:.65s"><circle cx="30" cy="92" r="4" fill="#38bdf8"/><text x="42" y="96">Contributions (past year)</text><text x="290" y="96" text-anchor="end">6</text></g>
  <g class="row" style="animation-delay:.8s"><circle cx="30" cy="118" r="4" fill="#2dd4bf"/><text x="42" y="122">Commits (last 30 days)</text><text x="290" y="122" text-anchor="end">3</text></g>
  <g class="row" style="animation-delay:.95s"><circle cx="30" cy="144" r="4" fill="#a78bfa"/><text x="42" y="148">Top language</text><text x="290" y="148" text-anchor="end">TypeScript</text></g>
</g>
<text x="24" y="172" font-size="10.5" fill="#5f7d87" style="animation:fadeIn .5s ease 1.4s forwards">early days · building in public 🚀</text>
</svg>
