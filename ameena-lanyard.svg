<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 330 520" width="460" height="726" role="img" aria-label="Ameena ID badge">
<title>Ameena — ID badge</title>
<defs>
<style type="text/css"><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes swing{0%{transform:rotate(0deg)}25%{transform:rotate(4.5deg)}50%{transform:rotate(0deg)}75%{transform:rotate(-4.5deg)}100%{transform:rotate(0deg)}}
@keyframes drop{0%{transform:translateY(-260px)}55%{transform:translateY(14px)}75%{transform:translateY(-6px)}100%{transform:translateY(0)}}
@keyframes shine{0%{transform:translateX(-140px) rotate(20deg)}100%{transform:translateX(340px) rotate(20deg)}}
@keyframes ringGlow{0%,100%{opacity:.55}50%{opacity:1}}
#rig{animation:drop 1.1s cubic-bezier(.2,.7,.3,1) forwards}
#pendulum{transform-box:fill-box;transform-origin:50% 0%;animation:swing 4.2s ease-in-out 1.1s infinite}
.shine{animation:shine 3.4s ease-in-out 2s infinite}
.rglow{transform-box:fill-box;transform-origin:center;animation:ringGlow 2.4s ease-in-out infinite}
]]></style>
<linearGradient id="strap" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#0891b2"/><stop offset="100%" stop-color="#0e7490"/>
</linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#0e2233"/><stop offset="100%" stop-color="#0a1826"/>
</linearGradient>
<linearGradient id="ringg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#38bdf8"/>
</linearGradient>
<linearGradient id="shineg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#ffffff" stop-opacity=".35"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="cardClip"><rect x="55" y="150" width="220" height="300" rx="18"/></clipPath>
<clipPath id="avatarClip"><circle cx="165" cy="230" r="52"/></clipPath>
</defs>

<g id="rig">
<g id="pendulum">
  <!-- strap -->
  <rect x="150" y="0" width="30" height="150" fill="url(#strap)"/>
  <text x="165" y="30" text-anchor="middle" font-size="9" fill="#a5f3fc" transform="rotate(90 165 30)" opacity=".8">DATA · ANALYST · DATA · ANALYST</text>
  <text x="165" y="90" text-anchor="middle" font-size="9" fill="#a5f3fc" transform="rotate(90 165 90)" opacity=".8">DATA · ANALYST · DATA · ANALYST</text>

  <!-- clasp + ring -->
  <rect x="152" y="128" width="26" height="16" rx="4" fill="#64748b"/>
  <circle class="rglow" cx="165" cy="150" r="12" fill="none" stroke="url(#ringg)" stroke-width="4" filter="url(#glow)"/>

  <!-- card -->
  <g clip-path="url(#cardClip)">
    <rect x="55" y="150" width="220" height="300" fill="url(#card)"/>
    <rect x="55" y="150" width="220" height="300" fill="url(#dotsL)"/>
  </g>
  <rect x="55" y="150" width="220" height="300" rx="18" fill="none" stroke="#164d5e" stroke-width="1.5"/>

  <!-- top bar -->
  <rect x="55" y="150" width="220" height="34" rx="18" fill="#0f2a33"/>
  <rect x="55" y="166" width="220" height="18" fill="#0f2a33"/>
  <text x="165" y="173" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#5eead4">ACCESS · VERIFIED</text>

  <!-- avatar ring + photo -->
  <circle class="rglow" cx="165" cy="230" r="55" fill="none" stroke="url(#ringg)" stroke-width="3" filter="url(#glow)"/>
  <g clip-path="url(#avatarClip)">
    <rect x="113" y="178" width="104" height="104" fill="#0a1826"/>
    <image href="./ameena-face-embedded.png" x="93" y="168" width="150" height="133" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- name / role -->
  <text x="165" y="308" text-anchor="middle" font-size="20" font-weight="800" fill="#e6f6f8">Ameena</text>
  <text x="165" y="330" text-anchor="middle" font-size="12.5" fill="#38bdf8">Data Analyst</text>
  <text x="165" y="350" text-anchor="middle" font-size="11" fill="#5eead4">@ameenaapss-ctrl</text>

  <!-- divider -->
  <line x1="80" y1="366" x2="250" y2="366" stroke="#164d5e" stroke-width="1"/>

  <!-- barcode -->
  <g transform="translate(80,382)" fill="#22d3ee" opacity=".85">
    <rect x="0" y="0" width="2" height="30"/><rect x="5" y="0" width="1" height="30"/><rect x="9" y="0" width="3" height="30"/>
    <rect x="15" y="0" width="1" height="30"/><rect x="19" y="0" width="2" height="30"/><rect x="24" y="0" width="4" height="30"/>
    <rect x="31" y="0" width="1" height="30"/><rect x="35" y="0" width="2" height="30"/><rect x="40" y="0" width="1" height="30"/>
    <rect x="44" y="0" width="3" height="30"/><rect x="50" y="0" width="1" height="30"/><rect x="54" y="0" width="2" height="30"/>
    <rect x="59" y="0" width="4" height="30"/><rect x="66" y="0" width="1" height="30"/><rect x="70" y="0" width="2" height="30"/>
    <rect x="75" y="0" width="1" height="30"/><rect x="79" y="0" width="3" height="30"/><rect x="85" y="0" width="1" height="30"/>
    <rect x="89" y="0" width="2" height="30"/><rect x="94" y="0" width="4" height="30"/><rect x="101" y="0" width="1" height="30"/>
    <rect x="105" y="0" width="2" height="30"/><rect x="110" y="0" width="1" height="30"/><rect x="114" y="0" width="3" height="30"/>
    <rect x="120" y="0" width="1" height="30"/><rect x="124" y="0" width="2" height="30"/><rect x="129" y="0" width="4" height="30"/>
    <rect x="136" y="0" width="1" height="30"/><rect x="140" y="0" width="2" height="30"/><rect x="145" y="0" width="1" height="30"/>
    <rect x="149" y="0" width="3" height="30"/><rect x="155" y="0" width="1" height="30"/><rect x="159" y="0" width="2" height="30"/>
    <rect x="164" y="0" width="4" height="30"/><rect x="171" y="0" width="1" height="30"/>
  </g>
  <text x="165" y="428" text-anchor="middle" font-size="9" letter-spacing="3" fill="#5eead4" opacity=".8">ID · 0920 · APSS</text>

  <!-- holographic shine sweep -->
  <g clip-path="url(#cardClip)">
    <rect class="shine" x="0" y="130" width="70" height="340" fill="url(#shineg)" transform-origin="165 300"/>
  </g>
</g>
</g>
<pattern id="dotsL" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r=".5" fill="rgba(34,211,238,.12)"/></pattern>
</svg>
